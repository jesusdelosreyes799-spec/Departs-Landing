<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — DeParts Systems</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --blue:#3b6bb5;
    --blue-dark:#2f5694;
    --ink:#1a1a1a;
    --text:#3d4757;
    --muted:#6b7585;
    --bg:#ffffff;
    --bg-soft:#eef2f9;
    --border:#dde3ec;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
    background:var(--bg-soft);color:var(--text);line-height:1.6;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px;
  }
  .card{
    background:var(--bg);border:1px solid var(--border);border-radius:14px;
    max-width:540px;width:100%;text-align:center;padding:52px 40px;
    box-shadow:0 12px 40px rgba(59,107,181,.10);
  }
  .check{
    width:76px;height:76px;border-radius:50%;background:var(--bg-soft);
    display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
    color:var(--blue);font-size:38px;font-weight:800;line-height:1;
  }
  .eyebrow{color:var(--blue);font-size:14px;letter-spacing:.5px;font-weight:600;margin-bottom:12px;}
  h1{font-size:34px;line-height:1.1;font-weight:800;color:var(--ink);letter-spacing:-.5px;margin-bottom:8px;}
  h1 .accent{color:var(--blue);}
  .rule{width:80px;height:5px;background:var(--blue);border-radius:3px;margin:20px auto 24px;}
  .lead{font-size:18px;color:var(--text);margin-bottom:6px;}
  .lead strong{color:var(--ink);}
  .btn{
    display:inline-block;background:var(--blue);color:#fff;font-weight:700;font-size:17px;
    padding:14px 30px;border:2px solid var(--blue);border-radius:8px;text-decoration:none;margin-top:28px;
  }
  .btn:hover{background:var(--blue-dark);border-color:var(--blue-dark);}
  .phone{margin-top:20px;color:var(--muted);font-size:15px;}
  .phone a{color:var(--blue);text-decoration:none;font-weight:600;}
  .phone a:hover{text-decoration:underline;}
  @media(max-width:640px){
    .card{padding:40px 24px;}
    h1{font-size:28px;}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check" aria-hidden="true">&#10003;</div>
    <div class="eyebrow">DeParts Systems</div>
    <h1>Thanks — <span class="accent">we got your request!</span></h1>
    <div class="rule"></div>
    <p class="lead">We'll text you shortly to talk through your build — <strong>usually within a few hours.</strong></p>
    <a href="index.html" class="btn">Back to Homepage</a>
    <div class="phone">Can't wait? Text us at <a href="sms:5109996938">(510) 999-6938</a></div>
  </div>
</body>
</html>
